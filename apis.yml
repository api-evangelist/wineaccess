description: 'Wine Access is an online wine retailer that curates limited-production and hard-to-find
  wines from around the world, sourced and vetted by its team of sommeliers and wine experts. Beyond
  direct e-commerce, the company operates a portfolio of subscription wine clubs (Discovery, Connoisseurs,
  Champagne, Collector''s, Decanter, and Sunset clubs), a wine podcast and editorial content platform at
  discover.wineaccess.com, corporate and personal gifting, gift cards, and climate-controlled shipping.
  Backed by Norwest Venture Partners. As of this profile, Wine Access publishes no public developer API,
  developer portal, or API documentation; it is a consumer e-commerce brand rather than an API provider.'
